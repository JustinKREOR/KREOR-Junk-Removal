// ─── HOOKS ────────────────────────────────────────────────────────────────────
function useReveal() {
  useEffect(() => {
    const els = document.querySelectorAll('.reveal');
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); } });
    }, { threshold: 0.12 });
    els.forEach(el => obs.observe(el));
    return () => obs.disconnect();
  });
}

function useCounter(target, active) {
  const [val, setVal] = useState(0);
  useEffect(() => {
    if (!active) return;
    let start = 0;
    const step = Math.ceil(target / 40);
    const t = setInterval(() => {
      start += step;
      if (start >= target) { setVal(target); clearInterval(t); }
      else setVal(start);
    }, 30);
    return () => clearInterval(t);
  }, [active, target]);
  return val;
}

function ContactModal({ open, onClose, t }) {
  const [form, setForm] = useState({ name:'', email:'', phone:'', message:'' });
  const [files, setFiles] = useState([]);
  const [dragging, setDragging] = useState(false);
  const [sent, setSent] = useState(false);
  const [loading, setLoading] = useState(false);
  const fileRef = useRef();

  useEffect(() => {
    if (open) { document.body.style.overflow = 'hidden'; setSent(false); }
    else document.body.style.overflow = '';
    return () => { document.body.style.overflow = ''; };
  }, [open]);

  function handleDrop(e) {
    e.preventDefault(); setDragging(false);
    const dropped = Array.from(e.dataTransfer.files);
    setFiles(f => [...f, ...dropped].slice(0,8));
  }
  function handleFiles(e) {
    setFiles(f => [...f, ...Array.from(e.target.files)].slice(0,8));
  }
  function removeFile(i) { setFiles(f => f.filter((_,j)=>j!==i)); }
  async function submit(e) {
    e.preventDefault();
    setLoading(true);
    try {
      const data = new FormData();
      data.append('name', form.name);
      data.append('email', form.email);
      data.append('phone', form.phone);
      data.append('message', form.message);
      files.forEach(f => data.append('attachment', f));
      const res = await fetch('https://formspree.io/f/xykoglgd', {
        method: 'POST',
        body: data,
        headers: { 'Accept': 'application/json' },
      });
      if (res.ok) { setSent(true); }
      else { alert('Une erreur est survenue. Veuillez réessayer ou nous appeler.'); }
    } catch(err) {
      alert('Une erreur est survenue. Veuillez nous appeler au 819 272-3003.');
    }
    setLoading(false);
  }

  if (!open) return null;
  return (
    <div style={{
      position:'fixed', inset:0, zIndex:999,
      background:'rgba(0,0,0,0.7)', backdropFilter:'blur(6px)',
      display:'flex', alignItems:'center', justifyContent:'center',
      padding:'16px', animation:'fadeIn 0.25s ease',
    }} onClick={e => { if(e.target===e.currentTarget) onClose(); }}>
      <div style={{
        background:'#fff', borderRadius:24, width:'100%', maxWidth:580,
        maxHeight:'92vh', overflow:'auto', position:'relative',
        animation:'fadeUp 0.3s ease',
        boxShadow:'0 40px 120px rgba(0,0,0,0.3)',
      }}>
        <button onClick={onClose} style={{
          position:'absolute', top:20, right:20, background:'rgba(0,0,0,0.06)',
          border:'none', borderRadius:'50%', width:40, height:40, fontSize:20,
          cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center',
          zIndex:1, transition:'background 0.2s',
        }}
          onMouseEnter={e=>e.target.style.background='rgba(0,0,0,0.12)'}
          onMouseLeave={e=>e.target.style.background='rgba(0,0,0,0.06)'}>✕</button>

        {sent ? (
          <div style={{ padding:'64px 48px', textAlign:'center' }}>
            <div style={{ fontSize:64, marginBottom:20, animation:'float 2s ease-in-out infinite' }}>✅</div>
            <h3 style={{ fontSize:26, fontWeight:800, marginBottom:12 }}>{t.contact.success}</h3>
            <button onClick={onClose} style={{
              marginTop:32, background:'var(--orange)', color:'#fff', border:'none',
              borderRadius:50, padding:'14px 36px', fontWeight:700, fontSize:16,
              cursor:'pointer', fontFamily:'var(--font)',
            }}>OK</button>
          </div>
        ) : (
          <form onSubmit={submit} style={{ padding:'40px 40px 36px' }}>
            <div style={{ marginBottom:28 }}>
              <div style={{ display:'inline-flex', alignItems:'center', gap:8, background:'rgba(224,92,42,0.08)', border:'1px solid var(--orange)', borderRadius:50, padding:'6px 16px', marginBottom:16 }}>
                <span style={{ fontSize:16 }}>🎯</span>
                <span style={{ fontWeight:700, fontSize:12, color:'var(--orange)', letterSpacing:0.5 }}>{t.nav.cta.toUpperCase()}</span>
              </div>
              <h2 style={{ fontSize:24, fontWeight:800, letterSpacing:-0.5 }}>{t.contact.title}</h2>
              <p style={{ color:'var(--gray)', marginTop:6, fontSize:14 }}>{t.contact.sub}</p>
            </div>

            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:14, marginBottom:14 }}>
              {[['name',t.contact.name,'text'],['email','Email','email']].map(([k,pl,type]) => (
                <input key={k} type={type} placeholder={pl} required value={form[k]}
                  onChange={e=>setForm(f=>({...f,[k]:e.target.value}))}
                  style={{ ...inputStyle }} />
              ))}
            </div>
            <input type="tel" placeholder={t.contact.phone} value={form.phone}
              onChange={e=>setForm(f=>({...f,phone:e.target.value}))}
              style={{ ...inputStyle, width:'100%', marginBottom:14 }} />
            <textarea placeholder={t.contact.message} value={form.message} required
              onChange={e=>setForm(f=>({...f,message:e.target.value}))}
              style={{ ...inputStyle, width:'100%', minHeight:110, resize:'vertical', marginBottom:14 }}/>

            {/* File upload */}
            <div onDrop={handleDrop} onDragOver={e=>{e.preventDefault();setDragging(true);}} onDragLeave={()=>setDragging(false)}
              onClick={()=>fileRef.current.click()}
              style={{
                border:`2px dashed ${dragging?'var(--orange)':'rgba(0,0,0,0.15)'}`,
                borderRadius:14, padding:'22px 20px', cursor:'pointer', textAlign:'center', marginBottom:14,
                background: dragging ? 'rgba(224,92,42,0.04)' : 'var(--cream)',
                transition:'all 0.2s',
              }}>
              <div style={{ fontSize:26, marginBottom:6 }}>📎</div>
              <div style={{ fontWeight:600, fontSize:14 }}>{t.contact.attach}</div>
              <div style={{ color:'var(--gray)', fontSize:12, marginTop:4 }}>{t.contact.attachSub}</div>
              <input ref={fileRef} type="file" multiple accept="image/*,.pdf,.doc,.docx"
                style={{ display:'none' }} onChange={handleFiles}/>
            </div>

            {files.length > 0 && (
              <div style={{ display:'flex', flexWrap:'wrap', gap:8, marginBottom:14 }}>
                {files.map((f,i) => (
                  <div key={i} style={{ display:'flex', alignItems:'center', gap:6, background:'var(--cream2)', borderRadius:50, padding:'6px 14px', fontSize:12, fontWeight:500 }}>
                    <span>📄</span> {f.name.length>20 ? f.name.slice(0,18)+'…' : f.name}
                    <button type="button" onClick={()=>removeFile(i)} style={{ background:'none', border:'none', cursor:'pointer', color:'var(--gray)', fontSize:14, lineHeight:1 }}>×</button>
                  </div>
                ))}
              </div>
            )}

            <button type="submit" disabled={loading} style={{
              width:'100%', background:'var(--orange)', color:'#fff', border:'none',
              borderRadius:50, padding:'16px', fontWeight:800, fontSize:17, cursor:'pointer',
              fontFamily:'var(--font)', transition:'all 0.2s',
              opacity: loading ? 0.7 : 1,
              display:'flex', alignItems:'center', justifyContent:'center', gap:10,
            }}>
              {loading ? <><span style={{ width:18, height:18, border:'2px solid rgba(255,255,255,0.4)', borderTopColor:'#fff', borderRadius:'50%', animation:'spin 0.7s linear infinite', display:'inline-block' }}></span> Envoi...</> : <>{t.contact.send} →</>}
            </button>
          </form>
        )}
      </div>
    </div>
  );
}

const inputStyle = {
  border: '1.5px solid rgba(0,0,0,0.1)',
  borderRadius: 12,
  padding: '14px 16px',
  fontSize: 15,
  fontFamily: 'var(--font)',
  outline: 'none',
  background: 'var(--cream)',
  color: 'var(--dark)',
  transition: 'border-color 0.2s',
  width: '100%',
};

// ─── TWEAKS ───────────────────────────────────────────────────────────────────
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentColor": "#c09856",
  "heroDark": false,
  "roundedCards": true
}/*EDITMODE-END*/;

// ─── APP ──────────────────────────────────────────────────────────────────────
function App() {
  const [lang, setLang] = useState('fr');
  const [contactOpen, setContactOpen] = useState(false);
  const [tweaksVisible, setTweaksVisible] = useState(false);
  const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);
  const t = CONTENT[lang];

  // Apply accent color
  useEffect(() => {
    document.documentElement.style.setProperty('--orange', tweaks.accentColor);
  }, [tweaks.accentColor]);

  // Tweaks host protocol
  useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweaksVisible(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksVisible(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  function setTweak(key, val) {
    const next = { ...tweaks, [key]: val };
    setTweaks(next);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: next }, '*');
  }

  return (
    <>
      <Navbar lang={lang} setLang={setLang} openContact={() => setContactOpen(true)} t={t} />
      <Hero openContact={() => setContactOpen(true)} t={t} tweaks={tweaks} />
      <TickerBar text={t.ticker} />
      <Services t={t} />
      <WhyUs t={t} openContact={() => setContactOpen(true)} />
      <Zone t={t} />
      <Testimonials t={t} />
      <FAQ t={t} />
      <About t={t} openContact={() => setContactOpen(true)} />
      <Footer t={t} openContact={() => setContactOpen(true)} />
      <ContactModal open={contactOpen} onClose={() => setContactOpen(false)} t={t} />

      {/* Floating phone button */}
      <a href="tel:8192723003" style={{
        position:'fixed', bottom:28, right:28, zIndex:90,
        background:'var(--orange)', color:'#fff',
        borderRadius:50, padding:'14px 22px',
        fontWeight:800, fontSize:15, textDecoration:'none',
        boxShadow:'0 8px 32px rgba(224,92,42,0.45)',
        display:'flex', alignItems:'center', gap:8,
        animation:'pulse 3s ease-in-out infinite',
        transition:'transform 0.2s',
      }}
        onMouseEnter={e=>{e.currentTarget.style.animationPlayState='paused'; e.currentTarget.style.transform='scale(1.07)';}}
        onMouseLeave={e=>{e.currentTarget.style.animationPlayState='running'; e.currentTarget.style.transform='scale(1)';}}>
        📞 819 272-3003
      </a>

      {/* Tweaks Panel */}
      {tweaksVisible && (
        <div style={{
          position:'fixed', bottom:80, left:20, zIndex:200,
          background:'#fff', borderRadius:20, padding:'24px 24px',
          boxShadow:'0 16px 60px rgba(0,0,0,0.18)',
          width:260, border:'1.5px solid rgba(0,0,0,0.08)',
          fontFamily:'var(--font)',
        }}>
          <h4 style={{ fontWeight:800, fontSize:16, marginBottom:20, letterSpacing:-0.3 }}>Tweaks</h4>

          <label style={tweakLabelStyle}>Couleur accent
            <input type="color" value={tweaks.accentColor} onChange={e=>setTweak('accentColor',e.target.value)}
              style={{ width:40, height:28, border:'none', borderRadius:6, cursor:'pointer', background:'none' }}/>
          </label>

          <label style={tweakLabelStyle}>Hero sombre
            <div onClick={() => setTweak('heroDark', !tweaks.heroDark)} style={{
              width:44, height:24, borderRadius:50, background: tweaks.heroDark ? 'var(--orange)' : '#ddd',
              cursor:'pointer', position:'relative', transition:'background 0.25s',
            }}>
              <div style={{ width:18, height:18, borderRadius:'50%', background:'#fff', position:'absolute', top:3,
                left: tweaks.heroDark ? 23 : 3, transition:'left 0.25s', boxShadow:'0 1px 4px rgba(0,0,0,0.2)' }}/>
            </div>
          </label>

          <label style={tweakLabelStyle}>Cartes arrondies
            <div onClick={() => setTweak('roundedCards', !tweaks.roundedCards)} style={{
              width:44, height:24, borderRadius:50, background: tweaks.roundedCards ? 'var(--orange)' : '#ddd',
              cursor:'pointer', position:'relative', transition:'background 0.25s',
            }}>
              <div style={{ width:18, height:18, borderRadius:'50%', background:'#fff', position:'absolute', top:3,
                left: tweaks.roundedCards ? 23 : 3, transition:'left 0.25s', boxShadow:'0 1px 4px rgba(0,0,0,0.2)' }}/>
            </div>
          </label>
        </div>
      )}
    </>
  );
}

const tweakLabelStyle = {
  display:'flex', justifyContent:'space-between', alignItems:'center',
  fontSize:13, fontWeight:500, marginBottom:16, cursor:'pointer',
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<style>
@media (max-width: 768px) {
  .desktop-nav { display: none !important; }
  .mobile-nav-right { display: flex !important; }
  .mobile-menu { display: block !important; }
}
@media (min-width: 769px) {
  .mobile-nav-right { display: none !important; }
  .mobile-menu { display: none !important; }
}
</style>
</body>
</html>
